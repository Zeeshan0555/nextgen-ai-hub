name: NeuroWire Repair Branch Verification

on:
  push:
    branches:
      - fix/news-source-accuracy
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Install, typecheck, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run TypeScript check
        run: npm run typecheck

      - name: Run production build
        run: npm run build
        env:
          # Non-secret placeholders for static build validation only.
          # No real Supabase project or credentials are accessed by this workflow.
          NEXT_PUBLIC_SUPABASE_URL: https://build-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder-not-a-real-key

      - name: Prepare repair-branch checkpoint archive
        if: success()
        env:
          CHECKPOINT_COMMIT: ${{ github.sha }}
          CHECKPOINT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          checkpoint_root="${RUNNER_TEMP}/neurowire-checkpoint"
          project_root="${checkpoint_root}/NeuroWire-Project"
          mkdir -p "${project_root}"

          git archive --format=tar "${CHECKPOINT_COMMIT}" | tar -xf - -C "${project_root}"

          cat > "${checkpoint_root}/PROGRESS-REPORT.md" <<EOF
          # NeuroWire Repair Branch Snapshot

          - Branch: ${CHECKPOINT_BRANCH}
          - Source commit: ${CHECKPOINT_COMMIT}
          - Snapshot date: 2026-11-16
          - Project source: `NeuroWire-Project/`

          ## Included work

          - Reconciled package and Tailwind/PostCSS dependency versions so clean installation, TypeScript checking, and the production build can run in CI.
          - Removed unsupported generated news paragraphs, false verification statements, and random unrelated image fallbacks.
          - Added a public Binance market-data endpoint for BTC/USDT, ETH/USDT, and SOL/USDT, with honest source, timestamp, and unavailable states.
          - Restored six homepage category filters (AI, Crypto, Policy, Technology, Fox News, Leadership) and connected the drawer links to those filters.
          - Removed fabricated sidebar counts, unverified database/security status claims, and non-working timestamp controls.
          - Replaced invented dashboard metrics with values derived from the existing recent-article result and the public market endpoint.
          - Added safe HTTPS original-publisher links from RSS items to the article reader without adding database columns.

          ## Verification

          - `npm ci --no-audit --no-fund`: passed in this workflow run.
          - `npm run typecheck`: passed in this workflow run.
          - `npm run build`: passed in this workflow run.
          - A unit-test script is not defined in the current `package.json`; no unit-test suite is claimed as run.
          - External RSS/market runtime availability is not established by a successful build alone.

          ## Important scope notes

          - This is a repair-branch snapshot based on the GitHub `main` branch, not a verified reconstruction of Checkpoint 50.
          - The existing Checkpoint 50 backup must be preserved; do not overwrite it with this snapshot.
          - No merge to `main` or production deployment is performed by this workflow.
          - Supabase project settings, credentials, schema, and database configuration were not changed.
          - Vercel preview/check status must be reviewed separately; this archive does not assert a successful Vercel deployment.
          - Admin authentication and browser push-notification functionality remain separate follow-up security/product tasks.
          EOF

          (
            cd "${checkpoint_root}"
            find . -type f ! -name "CHECKSUMS.sha256" -print0 | sort -z | xargs -0 sha256sum > CHECKSUMS.sha256
          )

      - name: Upload repair-branch checkpoint ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeuroWire-Checkpoint-51-Repair-Branch-${{ github.sha }}
          path: ${{ runner.temp }}/neurowire-checkpoint/
          if-no-files-found: error
          retention-days: 30
